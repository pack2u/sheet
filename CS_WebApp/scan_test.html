<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>택배 바코드 스캔 테스트 - Pack2U</title>
  <?!= include('csFavicon'); ?>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    /* ── 다크 기본값 (팔레트보다 먼저 깔린다) ── */
    html {
      background: #111111;
      color-scheme: dark; /* 스크롤바·기본 폼 컨트롤까지 어둡게 */
    }
    ::selection { background: rgba(173, 173, 173, 0.30); color: #f0f0f0; }
    * { scrollbar-width: thin; scrollbar-color: #393939 transparent; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #393939; border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: #494949; }

:root {
      --bg: #111111; --card: #252525; --text: #f0f0f0; --muted: #909090;
      --accent: #757575; --green: #34c77b; --orange: #f0a030; --red: #e74c5f;
      --border: rgba(255,255,255,0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    .bar { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: #1d1d1d; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    .back { width: 36px; height: 36px; border: none; border-radius: 10px; background: var(--card); color: var(--text); font-size: 22px; }
    .title { font-size: 16px; font-weight: 700; flex: 1; }
    .wrap { padding: 14px 16px 24px; }
    .tag { display: inline-block; font-size: 11px; padding: 3px 8px; border-radius: 6px; background: rgba(240,160,48,0.15); color: var(--orange); margin-bottom: 10px; }
    .hint { font-size: 13px; color: var(--muted); line-height: 1.55; margin-bottom: 12px; }
    .scan-box { background: #1d1d1d; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 12px; }
    .scan-label { padding: 10px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--border); }
    #qr-reader { width: 100%; min-height: 200px; }
    .row { display: flex; gap: 8px; margin-bottom: 12px; }
    .row input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 16px; }
    .btn { border: none; border-radius: 10px; padding: 12px 14px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .btn-blue { background: var(--accent); color: #fff; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--muted); width: 100%; margin-top: 8px; }
    .result { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-top: 12px; display: none; }
    .result.show { display: block; }
    .result.ok { border-color: rgba(52,199,123,0.35); }
    .result.fail { border-color: rgba(231,76,95,0.35); }
    .r-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
    .r-line { font-size: 13px; color: var(--muted); margin: 4px 0; word-break: break-all; }
    .r-line b { color: var(--text); font-weight: 600; }
    .chip { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 6px; margin-left: 6px; }
    .chip.ok { background: rgba(52,199,123,0.15); color: #6ee7a8; }
    .chip.warn { background: rgba(240,160,48,0.15); color: var(--orange); }
    .chip.bad { background: rgba(231,76,95,0.15); color: #f5a0a8; }
    .samples { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
    .sample { font-size: 11px; padding: 6px 8px; border-radius: 8px; background: var(--card); border: 1px solid var(--border); color: var(--muted); cursor: pointer; }
    .loading { display: none; position: fixed; inset: 0; background: rgba(17, 17, 17,0.88); z-index: 99; align-items: center; justify-content: center; flex-direction: column; gap: 10px; }
    .loading.on { display: flex; }
    .spin { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: rot 0.7s linear infinite; }
    @keyframes rot { to { transform: rotate(360deg); } }
    .ver { text-align: center; font-size: 11px; color: #616161; padding-top: 16px; }
  </style>
</head>
<body>
  <div class="bar">
    <button class="back" onclick="goHome()">‹</button>
    <div class="title">택배 바코드 스캔 테스트</div>
  </div>

  <div class="wrap">
    <span class="tag">롯데 ITF/CODE128 · v3.22</span>
    <div class="hint">
      롯데 송장은 보통 <b>12자리(2로 시작)</b> CODE128 바코드입니다.<br>
      가로 바코드에 맞춰 스캔창을 넓게 잡았습니다. 실물 라벨로 테스트해 보세요.
    </div>

    <div class="scan-box">
      <div class="scan-label">📷 카메라 스캔 (CODE128 우선)</div>
      <div id="qr-reader"></div>
    </div>

    <div class="row">
      <input id="manual" type="text" placeholder="스캔값 / 송장번호 직접 입력" inputmode="numeric" autocomplete="off">
      <button class="btn btn-blue" onclick="testManual()">테스트</button>
    </div>
    <button class="btn btn-blue" onclick="document.getElementById('fileInTop').click()">📷 촬영해서 인식 (모바일 권장)</button>
    <input type="file" id="fileInTop" style="display:none" accept="image/*" capture="environment" onchange="scanFile(event)">
    <button class="btn btn-outline" id="btnPopupScan" style="display:none" onclick="openScanPopup()">🖥 카메라 창 열고 연속 스캔 (PC)</button>
    <div id="embedBanner" style="display:none;margin:10px 0;padding:10px 12px;border-radius:10px;background:rgba(173, 173, 173,0.12);font-size:12px;line-height:1.5;color:#909090">
      구글 정책상 앱 화면 안에서는 카메라 영상이 열리지 않습니다.
      위 <b>촬영해서 인식</b>을 쓰면 폰 기본 카메라로 찍어 그대로 인식합니다.
      <button type="button" class="btn btn-blue" style="margin-top:8px;width:100%" onclick="openStandalone()">↗ Chrome/Safari 새 탭에서 열기</button>
    </div>

    <div class="hint" style="margin-top:4px">샘플 (파싱만 · 실제 송장 아님)</div>
    <div class="samples">
      <button class="sample" onclick="testSample('212345678905')">롯데 12자리</button>
      <button class="sample" onclick="testSample(']C1212345678905')">]C1 접두</button>
      <button class="sample" onclick="testSample('2123456789059999')">GS1 패딩</button>
    </div>

    <button class="btn btn-outline" onclick="resetScanner()">↻ 스캐너 재시작</button>

    <div class="result" id="result"></div>
  </div>

  <div class="loading" id="loading"><div class="spin"></div><div id="loadMsg">분석 중…</div></div>
  <div class="ver">롯데·CJ·로젠 공통 파서 · 주문조회 옵션</div>

  <?!= include('csScanPopup') ?>
  <?!= include('csDecode') ?>

  <script>
    var scanner = null;
    var lastRaw = "";
    var urlParams = new URLSearchParams(window.location.search);
    var CS_EXEC_URL = "<?= webAppUrl ?>";
    var CS_STAFF = "<?= staff ?>";
    var staff = urlParams.get("staff") || CS_STAFF || localStorage.getItem("pack2u_staff") || "";

    /** 웹앱 페이지 이동 — 최상위 프레임 기준 (iframe 내부 이동 시 Drive 오류) */
    function csGoTo(url) {
      try {
        if (window.top && window.top !== window.self) {
          window.top.location.href = url;
          return;
        }
      } catch (eTop) {}
      window.location.href = url;
    }

    function isEmbeddedApp() {
      try { return window.self !== window.top; } catch (e) { return true; }
    }
    function openStandalone() {
      window.open(
        CS_EXEC_URL + "?page=scan_test&staff=" + encodeURIComponent(staff),
        "_blank",
        "noopener"
      );
    }

    window.addEventListener("load", function() {
      // 라이브 카메라가 구조적으로 막힌 환경이면 시도조차 하지 않고 사진 경로만 안내
      if (csLiveCameraLikelyBlocked()) {
        var b = document.getElementById("embedBanner");
        if (b) b.style.display = "block";
        document.getElementById("qr-reader").innerHTML =
          '<div style="padding:20px;text-align:center;color:#909090;font-size:13px;line-height:1.6">' +
          '바코드가 화면을 꽉 채우게, 가로로 눕혀서 촬영하세요.<br>' +
          '바코드가 지워졌으면 인쇄된 숫자만 찍어도 인식합니다.</div>';
        return;
      }
      document.getElementById("btnPopupScan").style.display = "block";
      if (typeof Html5Qrcode === "undefined") {
        document.getElementById("qr-reader").innerHTML =
          '<div style="padding:20px;text-align:center;color:#909090;font-size:13px">스캔 라이브러리 로드 실패 — 사진 스캔 또는 직접 입력 사용</div>';
        return;
      }
      startScanner();
    });

    function goHome() {
      csGoTo(CS_EXEC_URL + "?page=home&staff=" + encodeURIComponent(staff));
    }

    function scannerFormats() {
      if (typeof Html5QrcodeSupportedFormats === "undefined") return null;
      return [
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
        Html5QrcodeSupportedFormats.ITF,
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.QR_CODE
      ];
    }

    function startScanner() {
      var fmts = scannerFormats();
      var cfg = fmts ? { formatsToSupport: fmts, verbose: false } : undefined;
      try {
        scanner = new Html5Qrcode("qr-reader", cfg);
        scanner.start(
          { facingMode: "environment" },
          { fps: 12, qrbox: { width: 320, height: 90 }, aspectRatio: 1.777 },
          onScan,
          function() {}
        ).catch(function(err) {
          document.getElementById("qr-reader").innerHTML =
            '<div style="padding:20px;text-align:center;color:#909090;font-size:13px">카메라 불가 — 사진 스캔 또는 직접 입력<br>' +
            '<button class="btn btn-blue" style="margin-top:10px" onclick="document.getElementById(\'fileIn\').click()">📷 사진 스캔</button>' +
            '<button class="btn btn-outline" style="margin-top:8px;width:100%" onclick="openStandalone()">↗ 새 탭에서 열기</button>' +
            '<input type="file" id="fileIn" style="display:none" accept="image/*" capture="environment" onchange="scanFile(event)"></div>';
        });
      } catch (e) {
        alert("스캐너 초기화 실패: " + e);
      }
    }

    /** 샌드박스를 벗어난 팝업에서 스캔 — 결과는 postMessage 로 돌아온다 */
    function openScanPopup() {
      var ok = csOpenScanPopup({
        title: "택배 송장 바코드 스캔",
        onResult: function (v) { lastRaw = ""; onScan(v); }
      });
      if (!ok) alert(csScanPopupBlockedMsg());
    }

    function scanFile(ev) {
      var f = ev.target.files[0];
      if (!f) return;
      showLoad("사진 분석…");
      csDecodeImageFile(f, {
        minDigits: 8,
        ocr: true,
        onStage: function(m) { if (m) showLoad(m); }
      })
        .then(function(r) {
          hideLoad();
          lastRaw = "";
          onScan(r.value);
        })
        .catch(function(e) { hideLoad(); alert(String(e && e.message ? e.message : e)); })
        .finally(function() { ev.target.value = ""; });
    }

    function stopScanner() {
      if (scanner) { scanner.stop().catch(function() {}); scanner = null; }
    }

    function resetScanner() {
      stopScanner();
      document.getElementById("qr-reader").innerHTML = "";
      document.getElementById("result").className = "result";
      setTimeout(startScanner, 200);
    }

    function onScan(text) {
      if (text === lastRaw) return;
      lastRaw = text;
      if (navigator.vibrate) navigator.vibrate(60);
      runTest(text, true);
    }

    function testManual() {
      var v = document.getElementById("manual").value.trim();
      if (!v) return;
      runTest(v, false);
    }

    function testSample(v) {
      document.getElementById("manual").value = v;
      runTest(v, false);
    }

    function showLoad(msg) {
      document.getElementById("loadMsg").textContent = msg || "분석 중…";
      document.getElementById("loading").classList.add("on");
    }
    function hideLoad() { document.getElementById("loading").classList.remove("on"); }

    function runTest(raw, fromScan) {
      showLoad("바코드 파싱…");
      google.script.run
        .withSuccessHandler(function(res) {
          hideLoad();
          showParseResult(raw, res);
          if (fromScan && res && res.ok && res.courier === "lotte") {
            lookupOrder(res.invoice);
          }
        })
        .withFailureHandler(function(err) {
          hideLoad();
          showParseResult(raw, { ok: false, error: err.message || String(err) });
        })
        .csParseCourierBarcode(raw);
    }

    function lookupOrder(invoice) {
      showLoad("주문 조회(롯데 송장)…");
      google.script.run
        .withSuccessHandler(function(order) {
          hideLoad();
          appendOrderResult(order);
        })
        .withFailureHandler(function() { hideLoad(); })
        .lookupByInvoice(invoice);
    }

    function showParseResult(raw, res) {
      var box = document.getElementById("result");
      box.className = "result show " + (res.ok ? "ok" : "fail");

      if (!res.ok) {
        box.innerHTML = '<div class="r-title">❌ 파싱 실패</div>' +
          '<div class="r-line">원문: <b>' + esc(raw) + '</b></div>' +
          '<div class="r-line">' + esc(res.error || "") + '</div>';
        return;
      }

      var courierLabel = { lotte: "롯데택배", cj: "CJ", logen: "로젠", hanjin: "한진", unknown: "미확인" };
      var cName = courierLabel[res.courier] || res.courier;
      var chk = "";
      if (res.courier === "lotte") {
        chk = res.checksumOk
          ? '<span class="chip ok">체크섬 OK</span>'
          : '<span class="chip warn">체크섬 불일치</span>';
      }

      box.innerHTML =
        '<div class="r-title">✅ 스캔 성공 ' + (res.courier === "lotte" ? "🚚" : "") + '</div>' +
        '<div class="r-line">원문: <b>' + esc(raw) + '</b></div>' +
        '<div class="r-line">택배사: <b>' + esc(cName) + '</b>' + chk + '</div>' +
        '<div class="r-line">송장: <b>' + esc(res.invoice) + '</b></div>' +
        (res.note ? '<div class="r-line">메모: ' + esc(res.note) + '</div>' : '') +
        '<div id="orderBlock"></div>' +
        '<div class="r-line" style="margin-top:10px;font-size:12px">롯데 조회: <a href="https://www.lotteglogis.com/home/reservation/tracking/linkView?InvNo=' +
        esc(res.invoice) + '" target="_blank" rel="noopener" style="color:#c1c1c1">배송추적 ↗</a></div>';
    }

    function appendOrderResult(order) {
      var el = document.getElementById("orderBlock");
      if (!el) return;
      if (order && order.found) {
        el.innerHTML = '<div class="r-line" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">' +
          '주문매칭: <b>' + esc(order.recipientName || "") + '</b> · ' + esc(order.productName || "") +
          ' <span class="chip ok">' + esc(order.source || "") + '</span></div>';
      } else {
        el.innerHTML = '<div class="r-line" style="margin-top:8px">주문매칭: <span class="chip warn">허브/마감에 없음</span></div>';
      }
    }

    function esc(s) {
      return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }
  </script>
</body>
</html>
