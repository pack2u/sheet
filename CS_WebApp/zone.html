<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>도서산간 조회</title>
<style>
  /* CS 웹앱의 다른 화면과 같은 결로 맞춘다 — 직원들이 이미 익힌 모양이다 */
  :root{
    --brand:#FDB813; --ink:#1a1a1a; --muted:#6b7280;
    --line:#e5e7eb; --bg:#f7f7f8; --card:#fff;
    --bad:#b91c1c; --warn:#b45309; --good:#166534;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.55 -apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif}
  .wrap{max-width:820px;margin:0 auto;padding:16px 14px 40px}
  .p2u-mark{display:inline-block;width:1em;height:1em;vertical-align:-0.14em;margin-right:.34em;
            background:url("data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20390%20390%22%3E%3Cpath%20fill%3D%22%23FDB913%22%20fill-rule%3D%22evenodd%22%20d%3D%22M0%2C195%20A195%2C195%200%201%201%20195%2C390%20L0%2C390%20Z%20M70%2C195%20A125%2C125%200%201%201%20109%2C285.7%20L109%2C318%20L70%2C318%20Z%20M195%2C109%20A86%2C86%200%201%200%20195%2C281%20A86%2C86%200%201%200%20195%2C109%20Z%22%2F%3E%3Cpath%20fill%3D%22%233C2F2F%22%20d%3D%22M0%2C0%20H104%20L0%2C104%20Z%22%2F%3E%3C%2Fsvg%3E") center/contain no-repeat}
  h1{font-size:20px;margin:6px 0 2px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 14px}

  textarea{width:100%;min-height:104px;border:1px solid var(--line);border-radius:12px;
           padding:11px 12px;font:inherit;background:var(--card);resize:vertical}
  textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}
  .row1{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .btn{background:var(--brand);color:#1a1a1a;font-weight:800;border:0;border-radius:12px;
       padding:13px 20px;font-size:15px;cursor:pointer;min-height:46px}
  .btn[disabled]{opacity:.5;cursor:not-allowed}
  .btn2{background:var(--card);border:1px solid var(--line);font-weight:700}
  .tiny{color:var(--muted);font-size:12px}

  #list{margin-top:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;
        padding:12px 13px;margin-bottom:9px}
  .card.hit{border-color:var(--brand);background:#fffbeb}
  .card.err{border-color:#fecaca;background:#fef2f2}
  .ad{font-weight:700;word-break:break-all}
  .zone{display:inline-block;font-weight:800;border-radius:999px;padding:3px 11px;
        font-size:13px;margin-top:6px}
  .z-n{background:#eef2f7;color:var(--muted)}
  .z-y{background:var(--brand);color:#1a1a1a}
  .meta{color:var(--muted);font-size:13px;margin-top:6px}
  .bad{color:var(--bad)}
  .note{background:#fff;border:1px solid var(--line);border-radius:12px;
        padding:11px 13px;margin-top:16px;font-size:13px;color:var(--muted)}
  .note b{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="p2u-mark"></span>도서산간 조회</h1>
  <p class="sub">주소를 넣으면 <b>로젠이 실제로 매기는 기준</b>으로 제주·연륙도서·산간 여부를 알려줍니다.</p>

  <textarea id="addr" placeholder="주소를 한 줄에 하나씩 (최대 10개)
예)
인천 강화군 교동면 대룡리 1
경기 평택시 포승읍 성해홍원로 91"></textarea>

  <div class="row1">
    <button class="btn" id="go" onclick="go()">조회</button>
    <button class="btn btn2" onclick="sample()">보기 채우기</button>
    <span class="tiny" id="cnt"></span>
  </div>

  <div id="list"></div>

  <div class="note">
    <b>이 화면은 보기만 합니다.</b> 세트분리의 도서산간 판정과 도선료는 아직 그대로입니다 —
    여기서 견주어 보고 다른 곳이 쌓이면 그때 바꿉니다.<br>
    섬은 <b>군 단위로 갈리지 않습니다</b>. 강화 읍내는 일반인데 교동도·석모도는 도서입니다.
  </div>
</div>

<script>
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  function sample(){
    document.getElementById('addr').value =
      ['인천 강화군 강화읍 관청리 1',
       '인천 강화군 교동면 대룡리 1',
       '충남 태안군 안면읍 창기리 1',
       '제주 제주시 공항로 2',
       '강원 평창군 대관령면 횡계리 1',
       '경기 평택시 포승읍 성해홍원로 91'].join('\n');
    count();
  }

  function lines(){
    return document.getElementById('addr').value
      .split('\n').map(function(s){ return s.trim(); }).filter(Boolean);
  }
  function count(){
    var n = lines().length;
    document.getElementById('cnt').textContent =
      n ? (n + '개' + (n > 10 ? '  ← 10개까지만 봅니다' : '')) : '';
  }
  document.getElementById('addr').addEventListener('input', count);

  function go(){
    var ls = lines();
    if (!ls.length) { document.getElementById('list').innerHTML =
      '<div class="card err">주소를 한 줄 이상 넣어 주세요.</div>'; return; }

    var b = document.getElementById('go');
    b.disabled = true; b.textContent = '묻는 중…';
    document.getElementById('list').innerHTML = '';

    google.script.run
      .withSuccessHandler(function(res){
        b.disabled = false; b.textContent = '조회';
        if (!res || !res.ok) {
          document.getElementById('list').innerHTML =
            '<div class="card err"><b>조회 실패</b><div class="meta bad">' +
            esc((res && res.error) || '알 수 없음') + '</div></div>';
          return;
        }
        render(res.rows || []);
      })
      .withFailureHandler(function(e){
        b.disabled = false; b.textContent = '조회';
        document.getElementById('list').innerHTML =
          '<div class="card err"><b>통신 실패</b><div class="meta bad">' +
          esc((e && e.message) || e) + '</div></div>';
      })
      .csLogenZoneLookup(ls);
  }

  function render(rows){
    var h = '';
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i];
      if (r.error) {
        h += '<div class="card err"><div class="ad">' + esc(r.addr) + '</div>' +
             '<div class="meta bad">' + esc(r.error) + '</div></div>';
        continue;
      }
      var hit = !!(r.jeju || r.ship || r.mont);
      var meta = [];
      if (r.zip) meta.push('우편번호 ' + esc(r.zip));
      if (r.dong) meta.push(esc(r.dong));
      if (r.bran) meta.push('지점 ' + esc(r.bran));
      if (r.sales) meta.push(esc(r.sales));
      if (r.tml) meta.push(esc(r.tml));
      if (r.classCd) meta.push('분류 ' + esc(r.classCd));

      h += '<div class="card' + (hit ? ' hit' : '') + '">' +
           '<div class="ad">' + esc(r.addr) + '</div>' +
           '<span class="zone ' + (hit ? 'z-y' : 'z-n') + '">' + esc(r.zone) + '</span>' +
           (meta.length ? '<div class="meta">' + meta.join(' · ') + '</div>' : '') +
           '</div>';
    }
    document.getElementById('list').innerHTML = h ||
      '<div class="card">결과가 없습니다.</div>';
  }
</script>
</body>
</html>
