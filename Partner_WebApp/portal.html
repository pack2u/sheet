  <script>
    /* 저장해 둔 테마를 그리기 전에 입힌다.
       body 나 onload 에서 하면 어두운 화면이 한 번 번쩍이고 밝게 바뀐다.
       CS 웹앱과 «같은 열쇠»를 쓴다 — 한 사람이 두 앱을 오가도 한 번만 고르면 된다. */
    (function () {
      try {
        var t = localStorage.getItem("pack2u_theme");
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
        }
      } catch (e) {}
    })();
  </script>

    :root {

    /* ── KPI ── */

    /* ── 카드 ── */

    /* 사진 썸네일 — 눌러 같은 화면 팝업으로 연다 (새 탭 아님) */
    .ev-thumbs { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
    /* 송장 사진은 «읽으려고» 보는 것이다. 52px 로는 글자가 안 보여
       매번 크게 열어야 했다. 칸이 넓어진 만큼 키운다. */
    .ev-thumbs button {
      display: block; width: 92px; height: 92px; border-radius: 7px; overflow: hidden;
      border: 1px solid transparent; background: var(--bg-sunken); position: relative;
      padding: 0; cursor: pointer;
    }
    .ev-thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .ev-thumbs .alt {
      display: none; position: absolute; inset: 0; align-items: center; justify-content: center;
      font-size: 9.5px; color: var(--text-secondary); text-align: center; line-height: 1.3;
    }
    .ev-thumbs button.fail .alt { display: flex; }

    /* 처리 단계 — "어디까지 됐나" 를 한눈에 보여 문의를 줄인다 */
    .steps { display: flex; gap: 3px; margin: 9px 0 2px; }
    .steps .st {
      flex: 1; min-width: 0; text-align: center; font-size: 9.5px; font-weight: 600;
      padding: 4px 2px 5px; border-radius: 6px; background: var(--bg-sunken); color: var(--text-muted);
      border-top: 2px solid transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    /*  ★ 지나온 자리에만 선을 남긴다 ★  (2026-09-20)
        네 칸 모두에 회색 선을 그으면 그 선이 「단계」가 아니라 「상자 테두리」로
        읽힌다. 지나온 칸과 지금 칸만 파랗게 긋는다 — 어디까지 왔는지는
        「색이 찬 데까지」로 읽힌다. */
    .steps .st.done { color: var(--text-secondary); border-top-color: var(--accent-blue); }
    .steps .st.now  { color: var(--accent-blue); background: var(--accent-blue-bg); border-top-color: var(--accent-blue); }
    .steps.off .st  { color: var(--text-muted); border-top-color: transparent; }
    .steps-off-note { font-size: 10.5px; color: var(--text-muted); margin: 9px 0 2px; }

    /* 액션 */
    /*  가름선 대신 여백으로 가른다 — 카드 안에 선이 하나 줄면 그만큼 조용해진다 */
    .c-foot { display: flex; gap: 6px; margin-top: 14px; }
    .act {
      flex: 1; padding: 9px 6px; border-radius: 9px; border: 1px solid transparent;

    .pop { display: none; margin-top: 9px; }

    .pop textarea {

    .empty { text-align: center; padding: 44px 20px; color: var(--text-muted); font-size: 13px; line-height: 1.8; }

    /*  줄을 긋는 대신 한 줄 걸러 바탕을 살짝 올린다 — 눈이 옆줄로 안 샌다 */
    .fee-tbl tbody tr:nth-child(odd) td { background: var(--bg-sunken); }

  <script>
  (function () {

    var SID = <?!= sidJson ?>;
    var VENDOR = <?!= vendorJson ?>;
    /* ★ 지난번에 본 시각 ★  (2026-09-18)
       > "우리 웹앱의 기본은 원활한 커뮤니케이션이야..
       >  체크하고 카톡으로 확인했습니다.. 이런 글을 또 남기는 번거로움을 줄이기"
       CS 가 앱에서 무엇을 해도 업체가 «열어 봐야만» 알면 아직 연락이 아니다.
       지난번 이후 CS 가 남긴 것이 있으면 그 카드를 눈에 걸리게 한다. */
    var LAST_SEEN = <?!= lastSeenJson ?>;
    var ROWS = [];
    var FILTER = 'active';
    var OPEN_POP = '';        // 열려 있는 문의창 (카드 idx)
    var ATT_TARGET = null;    // 사진 첨부 대상 {tab, row}
    var DUP_PENDING = null;   // 중복 확인 대기 중인 접수 payload
    var NEW_PHOTOS = [];      // 새 접수 대기 사진 {preview, base64, mimeType}
    var PHOTO_MAX = 6;
    var LOOKUP_HITS = [];     // 고유ID 조회 결과

    function el(id) { return document.getElementById(id); }
    function show(id, on) { el(id).classList.toggle('on', !!on); }
    function load(msg) { el('loadTxt').textContent = msg || '처리 중…'; show('load', true); }
    function unload() { show('load', false); }

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /**
     * 세션 만료 처리.
     *
     * **`location.reload()` 를 부르면 안 된다.** 이 화면은 Apps Script 샌드박스
     * iframe 안이고, 그 iframe 의 주소는 토큰이 없는 내부 주소
     * (googleusercontent/userCodeAppPanel) 다. 그것을 다시 열면 빈 문서가 떠서
     * **백색화면**이 된다. 토큰이 붙은 원본 링크는 최상위 프레임에만 있다.
     *
     * 최상위 프레임은 다른 출처라 `top.location.reload()` 가 막힌다(예외).
     * 그래서 시도해 보고, 막히면 사용자에게 새로고침을 안내한다.
     * 브라우저 새로고침은 원본 링크를 다시 열므로 항상 성공한다.
     */
    function handled(res) {
      if (!(res && res.authExpired)) return false;
      try {
        if (window.top && window.top !== window) {
          window.top.location.reload();
          return true;
        }
      } catch (e) { /* 다른 출처 — 아래 안내로 넘어간다 */ }
      expired();
      return true;
    }

    function expired() {
      unload();
      el('topSub').textContent = '접속 만료';
      el('list').innerHTML =
        '<div class="empty">접속 유효시간이 지났습니다.' +
        '<br><br>브라우저를 <b>새로고침</b>하면 다시 열립니다.' +
        '<br>받으신 링크를 다시 열어도 됩니다.</div>';
    }

    function fail(err) {
      unload();
      alert('오류: ' + (err && err.message ? err.message : err));
    }

    // ── 상태 배지 ──
    function badgeClass(status) {
      var s = String(status || '').replace(/\s/g, '');
      if (/완료|이카운트ok/i.test(s)) return 'b-ok';
      if (/철회|취소/.test(s)) return 'b-off';
      if (/입고|검수/.test(s)) return 'b-in';
      if (/수거/.test(s)) return 'b-mid';
      return 'b-new';
    }

    // ── 목록 ──
    function loadRows(refresh) {
      load(refresh ? '새로 불러오는 중…' : '반품 현황을 불러오는 중…');
      google.script.run
        .withSuccessHandler(function (res) {
          unload();
          if (handled(res)) return;
          if (!res || !res.ok) {
            el('list').innerHTML = '<div class="empty">' +
              esc((res && res.error) || '목록을 불러오지 못했습니다.') + '</div>';
            return;
          }
          ROWS = res.rows || [];
          el('topSub').textContent = VENDOR + ' · 최근 ' + res.days + '일';
          var s = res.summary || {};
          el('kAct').textContent = s.active || 0;
          el('kDone').textContent = s.done || 0;
          el('kToday').textContent = s.today || 0;
          el('kFee').textContent = s.feeSumText || '0원';
          render();
        })
        .withFailureHandler(fail)
        .prpMyReturns(SID, { refresh: !!refresh });
    }

    /* ══════════════════════════════════════════════════════════
       나열 차례

       > "반품현황에서 카드 나열을 선택할수 있게 해줘.. 최신순. 오래된순"

       ★ 서버가 쓰는 열쇠를 그대로 쓴다 ★
         sortKey 는 dateYmd_역순번 이다(prpLedger.gs). 여기서 날짜를 다시
         해석하면 차례를 정하는 규칙이 두 군데가 되고 언젠가 어긋난다.
       ★ 상태순도 stepIndex 를 그대로 쓴다 ★
         카드에 그리는 단계와 나열 차례가 다르면 사람이 못 믿는다.
       ★ 고른 것은 그 사람 브라우저에만 ★
         업체마다·사람마다 보는 차례가 다르다. 서버에 둘 일이 아니다.
       ══════════════════════════════════════════════════════════ */
    var SORT = 'new';
    try { SORT = localStorage.getItem('PRP_SORT') || 'new'; } catch (e) {}

    function setSort(v) {
      SORT = String(v || 'new');
      try { localStorage.setItem('PRP_SORT', SORT); } catch (e) {}
      render();
    }

    /* ══════════════════════════════════════════════════════════
       ★ 지난번에 본 뒤로 CS 가 남긴 것 ★  (2026-09-18)

       이벤트의 date 는 YYMMDD, time 은 HH:MM 이다. 지난번 접속은
       「yyyy-MM-dd HH:mm」 으로 온다. 둘을 «같은 자»로 만들어 견준다 —
       모양이 다른 채로 문자열 비교를 하면 조용히 늘 참이거나 늘 거짓이 된다.

       ★ 우리 글은 안 센다 ★ 업체가 자기가 쓴 글 때문에 새 소식 표시를
         보면 그건 소음이다. kind 'mine' 은 건너뛴다.
       ★ 처음 온 사람은 안 켠다 ★ 지난 기록이 없으면 전부가 새 것이라
         온 화면이 켜진다. 그건 알림이 아니다.
       ══════════════════════════════════════════════════════════ */
    function seenKey(s) {
      var d = String(s || '').replace(/[^0-9]/g, '');
      if (d.length >= 12) return d.substring(2, 12);   // yyyyMMddHHmm → yyMMddHHmm
      return '';
    }
    function evKey(e) {
      var d = String((e && e.date) || '').replace(/[^0-9]/g, '');
      if (d.length !== 6) return '';
      var t = String((e && e.time) || '').replace(/[^0-9]/g, '');
      while (t.length < 4) t += '0';
      return d + t.substring(0, 4);
    }
    var LAST_SEEN_KEY = seenKey(LAST_SEEN);

    /** 이 건에 «지난번 이후 CS 가 남긴 것»이 몇 개인가 */
    function freshCount(c) {
      if (!LAST_SEEN_KEY) return 0;
      var ev = (c && c.timeline) || [];
      var n = 0;
      for (var i = 0; i < ev.length; i++) {
        if (!ev[i] || ev[i].kind === 'mine') continue;   // 우리가 쓴 글은 빼고
        var k = evKey(ev[i]);
        if (k && k > LAST_SEEN_KEY) n++;
      }
      return n;
    }

    function sortRows(rows) {
      var key = function (c) { return String((c && c.sortKey) || ''); };
      var out = rows.slice();
      /*  새 소식이 있는 건은 어느 차례로 보든 맨 위 — CS 쪽과 같은 규칙이다 */
      var 새소식 = [], 나머지 = [];
      for (var f = 0; f < out.length; f++) {
        (freshCount(out[f]) > 0 ? 새소식 : 나머지).push(out[f]);
      }
      if (새소식.length) {
        새소식.sort(function (a, b) { return key(b).localeCompare(key(a)); });
        out = 나머지;
      }
      if (SORT === 'old') {
        out.sort(function (a, b) { return key(a).localeCompare(key(b)); });
      } else if (SORT === 'stage') {
        /*  손이 안 간 것부터 — 접수 → 회수중 → 입고검수 → 처리완료.
            철회(-1)는 흐름 밖이라 맨 뒤로 보낸다.
            같은 단계면 오래된 것이 위다 — 묵은 건이 밀려 안 보이면
            이 차례를 고른 뜻이 없다. */
        var st = function (c) {
          var i = stepIndex(c && c.status, c && c.done);
          return i < 0 ? 9 : i;
        };
        out.sort(function (a, b) {
          var sa = st(a), sb = st(b);
          if (sa !== sb) return sa - sb;
          return key(a).localeCompare(key(b));
        });
      } else {
        out.sort(function (a, b) { return key(b).localeCompare(key(a)); });
      }
      return 새소식.length ? 새소식.concat(out) : out;
    }

    function visible() {
      var q = el('q').value.replace(/\s/g, '').toLowerCase();
      return ROWS.filter(function (c) {
        if (FILTER === 'active' && c.done) return false;
        if (FILTER === 'done' && !c.done) return false;
        if (!q) return true;
        //  사유로도 찾게 한다 — 「깨짐」으로 모아 보는 일이 잦다 (2026-09-18)
        var hay = [c.name, c.item, c.invoice, c.returnInvoice, c.phone, c.phone2, c.phone2Name, c.status, c.type, c.reason]
          .join('').replace(/\s/g, '').toLowerCase();
        return hay.indexOf(q) >= 0;
      });
    }

    function render() {
      var rows = sortRows(visible());
      var _ss = el('sortSel');
      if (_ss && _ss.value !== SORT) _ss.value = SORT;
      if (!rows.length) {
        el('list').innerHTML = '<div class="empty">' +
          (el('q').value ? '검색 결과가 없습니다.' :
            (FILTER === 'done' ? '완료된 반품이 없습니다.' : '진행 중인 반품이 없습니다.')) +
          '</div>';
        return;
      }
      el('list').innerHTML = rows.map(cardHtml).join('');
    }

    /**
     * 카드 식별은 화면 순번이 아니라 탭·행으로 한다.
     * 검색어를 바꾸면 순번이 밀리므로 순번을 쓰면 엉뚱한 건에 문의가 달린다.
     */
    function keyOf(c) { return c.tab + ':' + c.row; }

    /**
     * 처리 단계 — "어디까지 됐나요" 문의를 줄이는 것이 목적이다.
     * CS 상태 옵션(_CS_RETURN_STATUS_OPTS_) 중 흐름을 이루는 것만 순서대로 둔다.
     * 철회·취소는 흐름을 벗어나므로 바를 그리지 않고 문장으로 알린다.
     */
    /* ══════════════════════════════════════════════════════════
     *  진행 단계 — CS 웹앱과 «같은 규칙»이라야 한다
     *  2026-09-11
     *
     *  > "반품현황에 상태값이 우리 웹앱 반품카드 상황과 안맞고
     *     서로 같이 반응도 안되"
     *
     *  ★ 무엇이 어긋나 있었나 ★
     *    CS 웹앱은 상태를 넷으로 줄였다 —
     *      접수 · 반품송장 · 입고검수 · 이카운트OK
     *    그런데 여기는 옛 일곱 단계(수거요청·수거중·반품입고·환불처리…)를
     *    그대로 두고 «그 낱말이 들어 있나»로 찾고 있었다.
     *    「반품송장」은 그 일곱 중 어디에도 안 걸려 맨 아래 return 0 으로
     *    떨어졌다 — CS 가 회수 송장을 냈는데 업체 화면은 계속 「접수」였다.
     *    오류가 아니라 «폴백»이라 아무도 몰랐다.
     *
     *  ★ 그래서 CS 의 _cs_returnStage_ 와 규칙을 맞춘다 ★
     *    (CS_WebApp/csOrderSearch.gs) 낱말은 업체가 읽을 말로 바꾸되
     *    «몇 단계인가»는 두 화면이 반드시 같아야 한다.
     *    한쪽만 고치면 또 조용히 갈라진다 — 쌍으로 고칠 것.
     *
     *  ★ 옛 낱말도 계속 받는다 ★
     *    드롭다운만 줄었을 뿐 지난 행에는 옛 글자가 그대로 남아 있다.
     *    수거요청·수거중 → 회수 / 반품입고 → 입고 / 환불처리 → 완료.
     * ══════════════════════════════════════════════════════════ */
    var STEPS = ['접수', '회수중', '입고검수', '처리완료'];

    function stepIndex(status, done) {
      var s = String(status || '').replace(/[ 	]/g, '');
      if (/철회|취소/.test(s)) return -1;
      if (done) return 3;
      if (/이카운트ok/i.test(s)) return 3;
      if (/완료|환불/.test(s)) return 3;
      /* 「입고」를 먼저 본다 — 「반품입고」가 「반품송장」보다 뒤 단계다 */
      if (/입고|검수/.test(s)) return 2;
      if (/반품송장|회수|수거/.test(s)) return 1;
      return 0;
    }

    function stepsHtml(c) {
      var idx = stepIndex(c.status, c.done);
      if (idx < 0) {
        return '<div class="steps-off-note">철회된 건입니다. 아래 진행 내역을 확인해 주세요.</div>';
      }
      var h = '<div class="steps">';
      for (var i = 0; i < STEPS.length; i++) {
        h += '<div class="st' + (i < idx ? ' done' : (i === idx ? ' now' : '')) + '">' +
          esc(STEPS[i]) + '</div>';
      }
      return h + '</div>';
    }

    function driveId(u) {
      var s = String(u || '');
      var m = s.match(/\/d\/([-\w]{20,})/) || s.match(/[?&]id=([-\w]{20,})/);
      return m ? m[1] : '';
    }

    /**
     * 이력 한 줄에서 드라이브 사진을 뽑아 썸네일로 만든다.
     * 첨부 파일은 ANYONE_WITH_LINK 로 공유되므로 업체 화면에서도 썸네일이 뜬다.
     * 드라이브 링크가 없으면 빈 문자열을 돌려 호출부가 일반 본문으로 처리한다.
     */
    function thumbsHtml(text) {
      var urls = String(text || '').match(/https?:\/\/[^\s]+/g) || [];
      var h = '', n = 0;
      for (var i = 0; i < urls.length; i++) {
        var id = driveId(urls[i]);
        if (!id) continue;
        n++;
        h += '<button type="button" class="thumb" data-id="' + esc(id) + '" title="사진 크게 보기">' +
          '<img src="https://drive.google.com/thumbnail?id=' + esc(id) + '&amp;sz=w480"' +
          ' alt="반품 사진" loading="lazy"' +
          ' onerror="this.parentNode.classList.add(\'fail\');this.remove()">' +
          '<span class="alt">사진<br>열기</span></button>';
      }
      return n ? '<div class="ev-thumbs">' + h + '</div>' : '';
    }

    /**
     * 송장 배송조회 링크.
     *
     * CS앱 home.html 의 URL 과 같아야 한다 — 한쪽만 바꾸면 업체와 CS가
     * 서로 다른 화면을 보며 통화하게 된다.
     * 택배사를 모를 때는 네이버 검색으로 보낸다 (CS앱과 같은 폴백).
     */
    var TRACK = [
      [/로젠/,          function (d) { return 'https://www.ilogen.com/web/personal/trace/' + d; }],
      [/CJ|대한통운/,   function (d) { return 'https://trace.cjlogistics.com/next/tracking.html?wblNo=' + d; }],
      [/한진/,          function (d) { return 'https://www.hanjin.com/kor/CMS/DeliveryMgr/WaybillResult.do?mCode=MN038&wblnum=' + d; }],
      [/롯데/,          function (d) { return 'https://www.lotteglogis.com/home/reservation/tracking/linkView?InvNo=' + d; }],
      [/우체국|우편/,   function (d) { return 'https://service.epost.go.kr/trace.RetrieveDomRigiTraceList.comm?displayHeader=N&sid1=' + d; }],
      [/대신/,          function (d) { return 'https://www.ds3211.co.kr/freight/internalFreightSearch.ht?billno=' + d; }],
      [/경동/,          function (d) { return 'https://kdexp.com/newDeliverySearch.kd?barcode=' + d; }]
    ];

    function trackUrl(invRaw, carrierHint) {
      var d = String(invRaw || '').replace(/[^0-9]/g, '');
      if (d.length < 8) return '';
      var c = String(carrierHint || '').replace(/\s/g, '');
      for (var i = 0; i < TRACK.length; i++) {
        if (c && TRACK[i][0].test(c)) return TRACK[i][1](d);
      }
      return 'https://search.naver.com/search.naver?query=' + encodeURIComponent(d + ' 배송조회');
    }

    /** 송장 한 줄 — 눌러서 배송조회로 보낸다. 업체가 가장 자주 묻는 항목이다. */
    function invLine(label, invRaw, carrierHint) {
      if (!invRaw) return '';
      var u = trackUrl(invRaw, carrierHint);
      var txt = esc(invRaw);
      return '<br><em>' + esc(label) + '</em> ' + (u
        ? '<a class="inv-link" href="' + esc(u) + '" target="_blank" rel="noopener" ' +
          'title="배송조회 열기">' + txt + '</a>'
        : txt);
    }

    /**
     * 반품송장 상자.
     * 아직 없으면 «없다고» 적는다 — 빈 자리는 「안 보여주는 것」인지
     * 「아직 안 나온 것」인지 구분이 안 된다. 그 차이로 전화가 온다.
     */
    function retInvBoxHtml(c) {
      var inv = String(c.returnInvoice || '').trim();
      if (!inv) {
        return '<div class="ret-inv-box none"><div class="lab">반품송장</div>' +
          '<div class="val">아직 없습니다 — 수거 접수 후 나옵니다</div></div>';
      }
      var u = trackUrl(inv, c.pickup);
      return '<div class="ret-inv-box"><div class="lab">반품송장' +
        (c.pickup ? ' · ' + esc(c.pickup) : '') + '</div>' +
        '<div class="val">' + (u
          ? '<a href="' + esc(u) + '" target="_blank" rel="noopener" title="배송조회 열기">' +
            esc(inv) + '</a>'
          : esc(inv)) + '</div></div>';
    }

    /** 같은 순간·같은 사람이 올린 것인가 (사진 여러 장을 한 칸으로 묶는 기준) */
    function sameMoment(a, b) {
      if (!a || !b) return false;
      if (a.kind !== b.kind) return false;
      if (String(a.who || '') !== String(b.who || '')) return false;
      if (String(a.date || '') !== String(b.date || '')) return false;
      return String(a.time || '') === String(b.time || '');
    }

    function tagClass(kind) {
      if (kind === 'status') return 't-status';
      if (kind === 'mine') return 't-mine';
      if (kind === 'photo') return 't-photo';
      if (kind === 'consult') return 't-consult';
      return 't-access';
    }

    function cardHtml(c) {
      var k = keyOf(c);
      var 새것 = freshCount(c);
      var h = '';
      h += '<div class="card' + (새것 ? ' card-fresh' : '') + '" data-k="' + esc(k) + '">';

      /* ★ 지난번 이후 CS 가 남긴 것 ★  (2026-09-18)
         여기까지 와야 «앱에서 한 일이 곧 연락»이 된다. 이게 없으면
         CS 가 확인을 눌러도 업체는 열어 봐야만 알고, 결국 전화를 건다. */
      if (새것) {
        h += '<div class="fresh-bar">' +
          '<span class="fresh-dot"></span>' +
          '<span>새 소식 ' + 새것 + '건 — 지난번에 보신 뒤로 CS팀이 남겼습니다</span>' +
          '</div>';
      }

      h += '<div class="c-head">';
      h += '<div class="c-name">' + esc(c.name || '(이름 없음)') + '</div>';
      h += '<span class="badge ' + badgeClass(c.status) + '">' + esc(c.status) + '</span>';
      h += '</div>';

      h += stepsHtml(c);

      h += '<div class="c-body">';

      h += '<div class="c-left"><div class="meta">';
      h += esc(c.item || '-') + (c.qty ? ' <em>×</em> ' + esc(c.qty) : '');
      /* ★ 왜 반품인지를 품목 바로 밑에 ★  (2026-09-18)
         > "업체 반품 현황에도 같이 적용해줘"
         대장 L열에 적혀 있었는데 K열이 먼저 자리를 차지해 한 번도 안
         읽혔다(prpMapCols_ 참고). 업체도 자기 건이 왜 반품인지 알아야
         다음에 안 그런다.
         구분(type)과 같은 말이면 두 번 적지 않는다 — 아래 sub 줄에 이미 나간다. */
      var 사유 = String(c.reason || '').trim();
      if (사유 && 사유 !== String(c.type || '').trim()) {
        h += '<div class="reason">' + esc(사유) + '</div>';
      }
      // 원송장은 우리가 보낸 것이라 택배사 힌트가 없다 → 네이버 검색으로 간다.
      // 반품송장은 수거입력처가 곧 택배사라 그 값을 힌트로 쓴다.
      h += invLine('원송장', c.invoice, '');
      if (c.pickup) h += '<br><em>수거</em> ' + esc(c.pickup);
      var ph = pickPhones(c.phone, c.phone2);
      if (ph.main) {
        h += '<br><em>연락처</em> ' + esc(ph.main) +
          (ph.mainTag ? ' <span class="ph-tag">' + esc(ph.mainTag) + '</span>' : '') +
          /* 이름은 «실번호» 옆에만 붙는다 — 안심번호의 주인이 아니다.
             회수 기사가 걸 때 누구를 찾으면 되는지가 이 한 낱말이다. */
          (c.phone2Name && !ph.mainTag ? ' <span class="ph-who">' + esc(c.phone2Name) + '</span>' : '') +
          (ph.sub ? ' <span class="ph-sub">· ' + esc(ph.subTag) + ' ' + esc(ph.sub) +
            (c.phone2Name && ph.subTag === '추가' ? ' ' + esc(c.phone2Name) : '') + '</span>' : '') +
          (ph.onlySafe ? ' <span class="ph-warn">기간이 지나면 끊깁니다</span>' : '');
      }
      if (c.fee) h += '<br><em>반품비</em> <span class="fee">' + esc(c.fee) + '</span>';
      h += '</div>';
      h += retInvBoxHtml(c);
      h += '<div class="sub">' + esc(c.date || '') +
        (c.type ? ' · ' + esc(c.type) : '') +
        ' · ' + esc(c.openedBy) + ' 접수</div>';
      h += '</div>';

      h += '<div class="c-right">';
      h += '<div class="tl-h">처리 경과</div>';
      h += '<div class="tl">';
      var ev = c.timeline || [];
      if (!ev.length) {
        h += '<div class="ev"><div class="ev-body">진행 내역이 아직 없습니다.</div></div>';
      } else {
        // 카운터를 k 로 쓰면 위에서 잡은 카드 키 k 를 덮어쓴다 (var 는 함수 스코프).
        // 그러면 c-foot 버튼의 data-k 가 숫자가 되어 카드 조회가 실패하고 버튼이 죽는다.
        for (var i = 0; i < ev.length; i++) {
          var e = ev[i];
          h += '<div class="ev">';
          h += '<div class="ev-when">' + esc(e.date || '') + (e.time ? ' ' + esc(e.time) : '') +
            '<span class="ev-tag ' + tagClass(e.kind) + '">' + esc(e.who) + '</span></div>';
          // 사진 줄이면 URL 을 늘어놓지 않고 썸네일로 보여준다.
          // CS 가 올린 것과 업체가 올린 것을 같은 방식으로 다룬다.
          var tb = thumbsHtml(e.text);
          if (tb) {
            /* ★ 같은 순간에 올린 사진은 한 칸에 모은다 ★  (2026-09-11)
               사진 한 장마다 카드가 따로 생겨 「260911 13:05 · 사진 첨부」가
               세로로 줄줄이 쌓였다. 같은 말이 반복되고 사진 옆은 비어 있었다.
               날짜·시각·올린 사람이 같으면 한 칸으로 본다 —
               한 번에 여러 장 올린 것이라 실제로 한 사건이다. */
            var urls = String(e.text || '');
            var j = i + 1;
            while (j < ev.length && sameMoment(e, ev[j]) && thumbsHtml(ev[j].text)) {
              urls += ' ' + String(ev[j].text || '');
              j++;
            }
            tb = thumbsHtml(urls);
            var 장수 = j - i;
            i = j - 1;
            var cap = String(e.text || '').replace(/https?:\/\/[^\s]+/g, '').trim() || '사진 첨부';
            if (장수 > 1) cap += ' ' + 장수 + '장';
            h += '<div class="ev-body">' + esc(cap) + '</div>' + tb;
          } else {
            h += '<div class="ev-body">' + linkify(e.text) + '</div>';
          }
          h += '</div>';
        }
      }
      h += '</div></div>';

      h += '</div>'; // c-body

      h += '<div class="c-foot">';
      h += '<button class="act" type="button" data-act="ask" data-k="' + esc(k) + '">문의</button>';
      h += '<button class="act" type="button" data-act="photo" data-k="' + esc(k) + '">사진 첨부</button>';
      h += '</div>';

      h += '<div class="pop' + (OPEN_POP === k ? ' on' : '') + '">';
      h += '<textarea data-ask="' + esc(k) + '" placeholder="CS팀에 전달할 문의 내용"></textarea>';
      h += '<div class="pop-row">';
      h += '<button class="act" type="button" data-act="askCancel" data-k="' + esc(k) + '">취소</button>';
      h += '<button class="act" type="button" data-act="askSend" data-k="' + esc(k) + '" ' +
        'style="background:var(--accent-blue);color:var(--on-accent);border-color:var(--accent-blue)">보내기</button>';
      h += '</div></div>';

      h += '</div>';
      return h;
    }

    /** 첨부 사진 링크가 이력에 섞여 들어오므로 눌러서 팝업으로 연다 */
    function linkify(text) {
      var s = esc(text || '');
      return s.replace(/(https?:\/\/[^\s<]+)/g, function (u) {
        var id = driveId(u);
        return id
          ? '<a href="#" class="thumb-link" data-id="' + id + '">사진 열기</a>'
          : '<a href="' + u + '" target="_blank" rel="noopener">링크 열기</a>';
      });
    }

    function openLightbox(id) {
      if (!id) return;
      el('photoFull').src = 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w1600';
      show('mPhoto', true);
    }
    function closeLightbox() {
      show('mPhoto', false);
      el('photoFull').removeAttribute('src');
    }

    // ── 카드 액션 ──
    el('list').addEventListener('click', function (ev) {
      var thumb = ev.target.closest('.ev-thumbs .thumb, a.thumb-link');
      if (thumb) {
        ev.preventDefault();
        openLightbox(thumb.getAttribute('data-id'));
        return;
      }
      var btn = ev.target.closest('button[data-act]');
      if (!btn) return;
      var k = btn.getAttribute('data-k');
      var act = btn.getAttribute('data-act');
      var c = null;
      for (var n = 0; n < ROWS.length; n++) {
        if (keyOf(ROWS[n]) === k) { c = ROWS[n]; break; }
      }
      if (!c) return;

      if (act === 'ask') {
        OPEN_POP = (OPEN_POP === k) ? '' : k;
        render();
        if (OPEN_POP) {
          var t = document.querySelector('[data-ask="' + k + '"]');
          if (t) t.focus();
        }
        return;
      }
      if (act === 'askCancel') { OPEN_POP = ''; render(); return; }

      if (act === 'askSend') {
        var box = document.querySelector('[data-ask="' + k + '"]');
        var text = box ? box.value : '';
        if (!text.trim()) { alert('문의 내용을 입력해 주세요.'); return; }
        load('문의를 전달하는 중…');
        google.script.run
          .withSuccessHandler(function (res) {
            unload();
            if (handled(res)) return;
            if (!res || !res.ok) { alert((res && res.error) || '전달 실패'); return; }
            OPEN_POP = '';
            loadRows(true);
          })
          .withFailureHandler(fail)
          .prpAddInquiry(SID, { tab: c.tab, row: c.row, text: text });
        return;
      }

      if (act === 'photo') {
        ATT_TARGET = { tab: c.tab, row: c.row };
        el('attFile').click();
      }
    });

    function shrinkFiles(files, done) {
      var list = [];
      var left = files.length;
      if (!left) { done([]); return; }
      files.forEach(function (f) {
        csLoadImage_(f)
          .then(function (img) {
            var canvas = csDrawCanvas_(img, 1600, 0);
            if (!canvas) throw new Error('사진을 처리할 수 없습니다.');
            var b64 = csCanvasToBase64_(canvas);
            if (!b64) throw new Error('사진을 변환할 수 없습니다.');
            var preview = '';
            try { preview = canvas.toDataURL('image/jpeg', 0.72); } catch (eP) {}
            list.push({ preview: preview, base64: b64, mimeType: 'image/jpeg' });
          })
          .catch(function () {})
          .then(function () {
            if (--left === 0) done(list);
          });
      });
    }

    // ── 사진 첨부 (카드) ──
    el('attFile').addEventListener('change', function (ev) {
      var files = Array.prototype.slice.call(ev.target.files || []);
      ev.target.value = '';
      if (!files.length || !ATT_TARGET) return;
      if (files.length > PHOTO_MAX) files = files.slice(0, PHOTO_MAX);

      load('사진을 올리는 중…');
      shrinkFiles(files, function (photos) {
        if (!photos.length) { unload(); alert('사진을 처리할 수 없습니다.'); return; }
        google.script.run
          .withSuccessHandler(function (res) {
            unload();
            if (handled(res)) return;
            if (!res || !res.ok) { alert((res && res.error) || '첨부 실패'); return; }
            loadRows(true);
          })
          .withFailureHandler(fail)
          .prpAttachPhotos(SID, {
            tab: ATT_TARGET.tab, row: ATT_TARGET.row,
            photos: photos
          });
      });
    });

    // ── 새 접수 ──
    function fillOpts(sel, arr) {
      el(sel).innerHTML = (arr || []).map(function (v) {
        return '<option value="' + esc(v) + '">' + esc(v) + '</option>';
      }).join('');
    }

    /* 수거 택배사 기본값. 서버가 알려 주기 전까지의 대비값이다 (2026-09-18) */
    var PICKUP_DEFAULT = '로젠택배';

    /**
     * 수거 택배사를 기본값으로 되돌린다.
     * ★ 「새로 만들기」를 열 때마다 부른다 ★ select 는 지난번에 고른 값을
     *   그대로 들고 있다. 한 번 딴 곳으로 바꾸면 다음 접수도 계속 딴 곳이다.
     * 목록에 없는 값이면 손대지 않는다 — 억지로 넣으면 빈 칸이 된다.
     */
    function setPickupDefault() {
      var s = el('nPickup');
      if (!s || !PICKUP_DEFAULT) return;
      for (var i = 0; i < s.options.length; i++) {
        if (s.options[i].value === PICKUP_DEFAULT) { s.value = PICKUP_DEFAULT; return; }
      }
    }

    function openNew() {
      ['nName', 'nPhone', 'nPhone2', 'nPhone2Name', 'nInv', 'nItem', 'nMemo', 'nUid']
        .forEach(function (k) { el(k).value = ''; });
      el('nPhoneHint').hidden = true;
      el('nQty').value = '1';
      /*  select 는 지난번 고른 값을 들고 있다 — 열 때마다 기본으로 되돌린다 */
      setPickupDefault();
      el('nMsg').textContent = '';
      el('nMsg').className = 'msg';
      el('nHits').innerHTML = '';
      LOOKUP_HITS = [];
      NEW_PHOTOS = [];
      renderNewPhotos();
      show('mNew', true);
      el('nUid').focus();
    }

    function newPayload(force) {
      return {
        uid: el('nUid').value,
        name: el('nName').value,
        phone: el('nPhone').value,
        phone2: el('nPhone2').value,
        phone2Name: el('nPhone2Name').value,
        qty: el('nQty').value,
        invoice: el('nInv').value,
        item: el('nItem').value,
        type: el('nType').value,
        pickup: el('nPickup').value,
        memo: el('nMemo').value,
        force: !!force
      };
    }

    /**
     * 불러온 번호가 안심번호면 알려 준다.
     * ★ 2026-09-09
     *
     * ★ 사람이 0504 를 알아보게 두지 않는다 ★
     *   안심번호는 배송이 끝나면 끊긴다. 그 번호만 적힌 채로 회수를 넣으면
     *   기사가 걸어도 안 받는 번호가 되고, 그때는 이미 물건이 나간 뒤다.
     *   화면이 먼저 말해 준다.
     *
     * ★ 막지는 않는다 ★
     *   실 번호를 모를 수도 있다. 안내만 하고 접수는 그대로 된다 —
     *   막으면 급한 건을 못 넣는다.
     */
    /* v2 의 is_safe_number 와 **같은 규칙**이다 (sql/04_reorder.sql 35행).
       두 곳이 다르게 판정하면 포털은 안심번호라 하고 v2 는 아니라 한다. */
    var SAFE_PREFIX = /^050[0-9]/;
    /* ★ 걸 수 있는 번호를 앞에 ★  (2026-09-11)
         > "쿠팡의 경우 안심번호라 기간이 지나면 연락이 안되"
       접수창은 진작부터 실번호를 받고 있었는데(nPhone2), 정작 «카드»는
       안심번호만 보여 주고 있었다. 받아 적은 값이 화면에 안 돌아온 셈이다.

       CS 웹앱 _cs_pickPhones_ · v2 lib/returns pickPhones 와 같은 규칙.
       셋 중 하나만 고치면 같은 건이 화면마다 다른 번호로 보인다. */
    /* 딱지 모양은 CSS 에. 아래 규칙과 한 쌍이다 */
    function pickPhones(phone, phone2) {
      var 주 = String(phone || '').trim();
      var 실 = String(phone2 || '').trim();
      var 주가안심 = SAFE_PREFIX.test(주.replace(/[^0-9]/g, ''));
      var 실이안심 = SAFE_PREFIX.test(실.replace(/[^0-9]/g, ''));
      if (실 && !실이안심) {
        return { main: 실, mainTag: '',
                 sub: (주 && 주 !== 실) ? 주 : '',
                 subTag: (주 && 주 !== 실) ? (주가안심 ? '안심' : '주문서') : '',
                 onlySafe: false };
      }
      return { main: 주 || 실,
               mainTag: 주 ? (주가안심 ? '안심' : '') : (실 ? '안심' : ''),
               sub: (주 && 실 && 주 !== 실) ? 실 : '',
               subTag: (주 && 실 && 주 !== 실) ? '추가' : '',
               onlySafe: !!(주 || 실) && (주 ? 주가안심 : true) };
    }

    function showSafeHint(phone) {
      var box = el('nPhoneHint');
      if (!box) return;
      var d = String(phone || '').replace(/[^0-9]/g, '');
      var safe = SAFE_PREFIX.test(d);
      box.hidden = !safe;
      if (safe) box.textContent = '안심번호입니다 — 배송이 끝나면 끊깁니다. 아래에 실 번호를 적어 주세요.';
    }

    function applyHit(h) {
      if (!h) return;
      if (h.uid) el('nUid').value = h.uid;
      if (h.name) el('nName').value = h.name;
      if (h.phone) {
        el('nPhone').value = h.phone;
        showSafeHint(h.phone);
      }
      if (h.phone2) el('nPhone2').value = h.phone2;
      if (h.qty) el('nQty').value = h.qty;
      else if (!el('nQty').value) el('nQty').value = '1';
      if (h.invoice) el('nInv').value = h.invoice;
      if (h.item) el('nItem').value = h.item;
    }

    function renderHits(matches) {
      LOOKUP_HITS = matches || [];
      var box = el('nHits');
      if (!LOOKUP_HITS.length) { box.innerHTML = ''; return; }
      if (LOOKUP_HITS.length === 1) {
        applyHit(LOOKUP_HITS[0]);
        box.innerHTML = '';
        return;
      }
      var h = '';
      for (var i = 0; i < LOOKUP_HITS.length; i++) {
        var m = LOOKUP_HITS[i];
        h += '<button class="hit" type="button" data-hit="' + i + '">' +
          '<b>' + esc(m.name || '(이름 없음)') + (m.item ? ' · ' + esc(m.item) : '') + '</b>' +
          (m.qty ? '수량 ' + esc(m.qty) + ' · ' : '') +
          (m.invoice ? '송장 ' + esc(m.invoice) : '송장 없음') +
          '</button>';
      }
      box.innerHTML = h;
    }

    function lookupUid() {
      var uid = el('nUid').value;
      if (!String(uid || '').trim()) { setNewMsg('고유아이디를 입력해 주세요.', true); return; }
      load('발주 마감에서 찾는 중…');
      google.script.run
        .withSuccessHandler(function (res) {
          unload();
          if (handled(res)) return;
          if (!res || !res.ok) {
            renderHits([]);
            setNewMsg((res && res.error) || '조회 실패', true);
            return;
          }
          renderHits(res.matches || []);
          if ((res.matches || []).length === 1) {
            setNewMsg('발주 마감에서 불러왔습니다.', false);
          } else {
            setNewMsg((res.matches || []).length + '건이 있습니다. 해당하는 주문을 눌러 주세요.', false);
          }
        })
        .withFailureHandler(function (e) { unload(); setNewMsg(String(e && e.message ? e.message : e), true); })
        .prpLookupByUid(SID, uid);
    }

    function renderNewPhotos() {
      var box = el('nPhotoPrev');
      var help = el('nPhotoHelp');
      if (!NEW_PHOTOS.length) {
        box.innerHTML = '';
        help.textContent = '최대 ' + PHOTO_MAX + '장. 접수할 때 함께 올라갑니다.';
        return;
      }
      var h = '';
      for (var i = 0; i < NEW_PHOTOS.length; i++) {
        h += '<span class="pend"><img src="' + NEW_PHOTOS[i].preview + '" alt="">' +
          '<button type="button" data-drop="' + i + '" title="빼기">×</button></span>';
      }
      box.innerHTML = h;
      help.textContent = NEW_PHOTOS.length + '장 첨부 대기 · 최대 ' + PHOTO_MAX + '장';
    }

    function stageNewPhotos(fileList) {
      var files = Array.prototype.slice.call(fileList || []);
      if (!files.length) return;
      var room = PHOTO_MAX - NEW_PHOTOS.length;
      if (room <= 0) { setNewMsg('사진은 ' + PHOTO_MAX + '장까지입니다.', true); return; }
      if (files.length > room) files = files.slice(0, room);
      load('사진을 준비하는 중…');
      shrinkFiles(files, function (photos) {
        unload();
        for (var i = 0; i < photos.length; i++) NEW_PHOTOS.push(photos[i]);
        renderNewPhotos();
      });
    }

    function uploadNewPhotos(res, done) {
      if (!NEW_PHOTOS.length) { done(''); return; }
      if (!res || !res.tab || !res.row) {
        done('사진은 올리지 못했습니다');
        return;
      }
      google.script.run
        .withSuccessHandler(function (att) {
          NEW_PHOTOS = [];
          done(att && att.ok ? ('사진 ' + (att.count || 0) + '장 첨부됨')
            : ('사진 첨부 실패: ' + ((att && att.error) || '오류')));
        })
        .withFailureHandler(function (err) {
          done('사진 첨부 실패: ' + String((err && err.message) || err));
        })
        .prpAttachPhotos(SID, {
          tab: res.tab, row: res.row,
          photos: NEW_PHOTOS.map(function (p) {
            return { base64: p.base64, mimeType: p.mimeType };
          })
        });
    }

    function submitNew(force) {
      var payload = newPayload(force);
      if (!payload.name.trim()) { setNewMsg('반품신청자 이름을 입력해 주세요.', true); return; }
      if (!payload.item.trim()) { setNewMsg('상품명을 입력해 주세요.', true); return; }

      load('접수하는 중…');
      google.script.run
        .withSuccessHandler(function (res) {
          if (handled(res)) { unload(); return; }
          if (res && res.duplicate) {
            unload();
            DUP_PENDING = payload;
            el('dupMsg').textContent = res.message;
            show('mDup', true);
            return;
          }
          if (!res || !res.ok) { unload(); setNewMsg((res && res.error) || '접수 실패', true); return; }
          uploadNewPhotos(res, function (photoMsg) {
            unload();
            show('mNew', false);
            loadRows(true);
            setTimeout(function () {
              alert((res.message || '접수되었습니다.') + (photoMsg ? '\n' + photoMsg : ''));
            }, 200);
          });
        })
        .withFailureHandler(function (e) { unload(); setNewMsg(String(e && e.message ? e.message : e), true); })
        .prpSubmitReturn(SID, payload);
    }

    function setNewMsg(t, isErr) {
      var m = el('nMsg');
      m.textContent = t;
      m.className = 'msg' + (isErr ? ' err' : ' ok');
    }

    // ── 송장 촬영 인식 ──
    el('nScan').addEventListener('click', function () { el('nScanFile').click(); });
    el('nScanFile').addEventListener('change', function (ev) {
      var f = ev.target.files && ev.target.files[0];
      ev.target.value = '';
      if (!f) return;
      load('사진 분석 중…');
      csDecodeImageFile(f, {
        minDigits: 8,
        ocr: true,
        onStage: function (m) { if (m) load(m); }
      })
        .then(function (r) {
          unload();
          el('nInv').value = r.value;
          setNewMsg('송장번호를 인식했습니다: ' + r.value, false);
        })
        .catch(function (e) {
          unload();
          setNewMsg(String(e && e.message ? e.message : e), true);
        });
    });

    // ── 반품비 정산 ──
    function openFee() {
      load('집계 중…');
      google.script.run
        .withSuccessHandler(function (res) {
          unload();
          if (handled(res)) return;
          if (!res || !res.ok) { alert((res && res.error) || '집계 실패'); return; }
          var months = res.months || [];
          if (!months.length) {
            el('feeBody').innerHTML = '<div class="empty">집계할 내역이 없습니다.</div>';
          } else {
            var h = '<table class="fee-tbl"><tr><th>월</th><th class="num">건수</th><th class="num">반품비</th></tr>';
            var tc = 0, tf = 0;
            months.forEach(function (m) {
              tc += m.count; tf += m.fee;
              var label = /^\d{6}$/.test(m.month)
                ? m.month.substring(0, 4) + '. ' + m.month.substring(4)
                : m.month;
              h += '<tr><td>' + esc(label) + '</td><td class="num">' + m.count +
                '</td><td class="num">' + esc(m.feeText || '-') + '</td></tr>';
            });
            h += '<tr><td><b>합계</b></td><td class="num"><b>' + tc +
              '</b></td><td class="num"><b>' + esc(fmtWon(tf)) + '</b></td></tr>';
            h += '</table>';
            el('feeBody').innerHTML = h;
          }
          show('mFee', true);
        })
        .withFailureHandler(fail)
        .prpFeeSummary(SID, { days: 365 });
    }

    function fmtWon(n) {
      return String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '원';
    }

    // ── 바인딩 ──
    /* ══════════════════════════════════════════════════════════════
       ★ 밝게 / 어둡게 ★  (2026-09-16)

       > "다크와 라이트 모드 2가지로 되게"

       CS 웹앱과 «같은 열쇠»(pack2u_theme)를 쓴다. 한 사람이 두 앱을
       오가도 한 번만 고르면 된다.
       단추에는 «지금 무엇인지»가 아니라 «누르면 무엇이 되는지»를 보인다 —
       어두울 때 ☀️, 밝을 때 🌙. (CS home.html 과 같은 규칙)
       ══════════════════════════════════════════════════════════════ */
    var PRP_THEME_KEY = 'pack2u_theme';

    function prpCurrentTheme() {
      return document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    }

    function prpApplyTheme(theme, persist) {
      var light = (theme === 'light');
      if (light) document.documentElement.setAttribute('data-theme', 'light');
      else document.documentElement.removeAttribute('data-theme');
      var btn = el('btnTheme');
      if (btn) {
        btn.textContent = light ? '🌙' : '☀️';
        btn.title = light ? '어둡게 보기' : '밝게 보기';
      }
      if (persist) {
        try { localStorage.setItem(PRP_THEME_KEY, light ? "light" : "dark"); } catch (eT) {}
      }
    }

    prpApplyTheme(prpCurrentTheme(), false);   // 단추 모양을 지금 상태에 맞춘다
    el('btnTheme').addEventListener('click', function () {
      prpApplyTheme(prpCurrentTheme() === 'light' ? 'dark' : 'light', true);
    });

    el('btnReload').addEventListener('click', function () { loadRows(true); });
    el('btnNew').addEventListener('click', openNew);
    el('nCancel').addEventListener('click', function () { show('mNew', false); });
    el('nSubmit').addEventListener('click', function () { submitNew(false); });
    el('nLookup').addEventListener('click', lookupUid);
    el('nUid').addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); lookupUid(); }
    });
    el('nHits').addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-hit]');
      if (!b) return;
      var i = parseInt(b.getAttribute('data-hit'), 10);
      if (LOOKUP_HITS[i]) {
        applyHit(LOOKUP_HITS[i]);
        el('nHits').innerHTML = '';
        setNewMsg('선택한 주문을 채웠습니다.', false);
      }
    });
    el('nPhotoFile').addEventListener('change', function (ev) {
      stageNewPhotos(ev.target.files);
      ev.target.value = '';
    });
    el('nPhotoCam').addEventListener('change', function (ev) {
      stageNewPhotos(ev.target.files);
      ev.target.value = '';
    });
    el('nPhotoPrev').addEventListener('click', function (ev) {
      var b = ev.target.closest('[data-drop]');
      if (!b) return;
      NEW_PHOTOS.splice(parseInt(b.getAttribute('data-drop'), 10), 1);
      renderNewPhotos();
    });
    el('photoClose').addEventListener('click', closeLightbox);
    el('mPhoto').addEventListener('click', function (ev) {
      if (ev.target === el('mPhoto')) closeLightbox();
    });
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && el('mPhoto').classList.contains('on')) closeLightbox();
    });
    document.addEventListener('paste', function (ev) {
      if (!el('mNew').classList.contains('on')) return;
      var cd = ev.clipboardData || window.clipboardData;
      if (!cd) return;
      var blobs = [];
      var items = cd.items || [];
      for (var i = 0; i < items.length; i++) {
        if (items[i].kind === 'file' && /^image\//i.test(items[i].type)) {
          var b = items[i].getAsFile();
          if (b) blobs.push(b);
        }
      }
      if (!blobs.length) return;
      ev.preventDefault();
      stageNewPhotos(blobs);
    });
    el('btnFee').addEventListener('click', openFee);
    el('feeClose').addEventListener('click', function () { show('mFee', false); });
    el('dupNo').addEventListener('click', function () { DUP_PENDING = null; show('mDup', false); });
    el('dupYes').addEventListener('click', function () {
      show('mDup', false);
      if (DUP_PENDING) { DUP_PENDING = null; submitNew(true); }
    });
    el('q').addEventListener('input', render);
    //  나열 차례를 바꾸면 바로 다시 그린다 (고른 값은 그 사람 브라우저에 남는다)
    el('sortSel').addEventListener('change', function () { setSort(this.value); });

    document.querySelectorAll('.segs button').forEach(function (b) {
      b.addEventListener('click', function () {
        document.querySelectorAll('.segs button').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        FILTER = b.getAttribute('data-f');
        OPEN_POP = '';
        render();
      });
    });

    // 작성 중인 접수창은 바깥을 눌러도 닫지 않는다 (적던 내용이 사라진다).
    // 정산·중복확인만 바깥 클릭으로 닫는다.
    ['mFee', 'mDup'].forEach(function (id) {
      el(id).addEventListener('click', function (ev) {
        if (ev.target === el(id)) show(id, false);
      });
    });

    // ── 시작 ──
    google.script.run
      .withSuccessHandler(function (res) {
        if (handled(res)) return;
        if (res && res.ok) {
          fillOpts('nType', res.types);
          fillOpts('nPickup', res.pickups);
          /* ★ 수거 택배사 기본값 ★  (2026-09-18)
             > "업체 반품접수 새로 만들기에서 수거택배사를 기본 로젠택배로 해줘"
             여태 목록 첫째(CJ대한통운)가 그냥 골라져 있었다 — 우리가 안 쓰는 곳이다.
             값은 서버(prpConfig.PRP_PICKUP_DEFAULT)가 정한다. 화면에 박으면
             다음에 택배사를 바꿀 때 또 두 곳을 고쳐야 한다. */
          if (res.pickupDefault) PICKUP_DEFAULT = res.pickupDefault;
          setPickupDefault();
          if (res.photoMax) PHOTO_MAX = res.photoMax;
        }
        loadRows(false);
      })
      .withFailureHandler(function () { loadRows(false); })
      .prpBootstrap(SID);
  })();
  </script>
</body>
</html>
